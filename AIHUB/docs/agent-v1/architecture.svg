<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="1115" viewBox="0 0 1110 1115" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
    <marker id="ahr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ef4444"/></marker>
    <marker id="aho" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f97316"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1110" height="1115" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">불량률 예측 파이프라인 — 질의 → 슬롯 채우기 → 검증 → ML 추론 → 응답</text>

  <g transform="translate(0,55)">
    <!-- ================= edges ================= -->
    <g fill="none" stroke="#475569" stroke-width="1.8">
      <path d="M520,80 L520,113" marker-end="url(#ah)"/>
      <path d="M520,180 L520,223" marker-end="url(#ah)"/>
      <path d="M520,290 L520,333" marker-end="url(#ah)"/>
      <path d="M520,400 L520,443" marker-end="url(#ah)"/>
      <path d="M520,510 L520,543" marker-end="url(#ah)"/>
      <path d="M520,610 L520,638" marker-end="url(#ah)"/>
      <path d="M520,705 L520,733" marker-end="url(#ah)"/>
      <path d="M520,800 L520,823" marker-end="url(#ah)"/>
      <path d="M520,890 L520,918" marker-end="url(#ah)"/>
      <path d="M660,775 H720 V955 H670" marker-end="url(#ah)"/>
    </g>
    <g fill="none" stroke="#ef4444" stroke-width="1.8">
      <path d="M660,150 L793,150" marker-end="url(#ahr)"/>
      <path d="M660,270 H710 V420 H920 V443" marker-end="url(#ahr)"/>
      <path d="M660,480 L793,480" marker-end="url(#ahr)"/>
      <path d="M660,675 L793,675" marker-end="url(#ahr)"/>
    </g>
    <g fill="none" stroke="#f97316" stroke-width="1.8">
      <path d="M380,172 H170 V333" marker-end="url(#aho)"/>
      <path d="M380,385 L290,385" marker-end="url(#aho)"/>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5">
      <path d="M60,370 H28 V50 H373" marker-end="url(#ahd)"/>
      <path d="M1040,480 H1075 V50 H667" marker-end="url(#ahd)"/>
    </g>

    <!-- ================= edge labels ================= -->
    <g font-size="11" fill="#ef4444">
      <text x="726" y="141" text-anchor="middle">추출 실패</text>
      <text x="666" y="262">허용값·범위 위반</text>
      <text x="726" y="471" text-anchor="middle">범위·허용값 위반</text>
      <text x="726" y="666" text-anchor="middle">호출·응답 검증 실패</text>
    </g>
    <g font-size="11" fill="#ea580c">
      <text x="188" y="200">예측 요청 아님</text>
      <text x="188" y="214">(records·세션 모두 비어 있음)</text>
      <text x="335" y="377" text-anchor="middle">누락·모호 필드</text>
    </g>
    <g font-size="11" fill="#0f766e">
      <text x="532" y="426">12개 필드 모두 충족</text>
      <text x="532" y="534">검증 통과</text>
    </g>
    <g font-size="11" fill="#475569">
      <text x="532" y="818">explain = true</text>
      <text x="728" y="790">explain = false</text>
    </g>
    <g font-size="11" fill="#94a3b8">
      <text x="120" y="42">사용자 추가 입력</text>
      <text x="1070" y="42" text-anchor="end">사용자 정정 입력</text>
    </g>

    <!-- ================= nodes ================= -->
    <!-- A -->
    <rect x="380" y="20" width="280" height="60" rx="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="520" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">사용자 질의</text>

    <!-- B -->
    <rect x="380" y="120" width="280" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="520" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">QueryExtractor</text>
    <text x="520" y="164" text-anchor="middle" font-size="11.5" fill="#64748b">SDC LLM 구조화 출력</text>

    <!-- V -->
    <rect x="380" y="230" width="280" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="520" y="255" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">validate_provided_fields</text>
    <text x="520" y="274" text-anchor="middle" font-size="11.5" fill="#64748b">값이 있는 필드만 개별 검증</text>

    <!-- M -->
    <rect x="380" y="340" width="280" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="520" y="365" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">SlotFillingSession.merge</text>
    <text x="520" y="384" text-anchor="middle" font-size="11.5" fill="#64748b">이전 턴 값과 병합</text>

    <!-- C -->
    <rect x="380" y="450" width="280" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="520" y="475" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">DefectRateInput</text>
    <text x="520" y="494" text-anchor="middle" font-size="11.5" fill="#64748b">Pydantic 최종 검증</text>

    <!-- F -->
    <rect x="380" y="550" width="280" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="520" y="574" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">입력 JSON 생성</text>
    <text x="520" y="594" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#475569">{ &quot;data&quot;: [ 12개 컬럼, ... ] }</text>

    <!-- G -->
    <rect x="380" y="645" width="280" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="520" y="670" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">DefectRateMLClient</text>
    <text x="520" y="689" text-anchor="middle" font-size="11.5" fill="#64748b">POST AI_HUB_ENDPOINT_URL</text>

    <!-- H -->
    <rect x="380" y="740" width="280" height="60" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.8"/>
    <text x="520" y="765" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155e75">predictions</text>
    <text x="520" y="784" text-anchor="middle" font-size="11.5" fill="#64748b">예측 불량률 (단위: %)</text>

    <!-- I -->
    <rect x="380" y="830" width="280" height="60" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.8"/>
    <text x="520" y="855" text-anchor="middle" font-size="13.5" font-weight="700" fill="#713f12">LLM 해설 생성</text>
    <text x="520" y="874" text-anchor="middle" font-size="11.5" fill="#78716c">실패 시 수치 답변으로 폴백</text>

    <!-- J -->
    <rect x="380" y="925" width="280" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
    <text x="520" y="950" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">status = ok</text>
    <text x="520" y="969" text-anchor="middle" font-size="11.5" fill="#4d7c5f">사용자 응답 반환</text>

    <!-- D -->
    <rect x="60" y="340" width="230" height="60" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.8"/>
    <text x="175" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">status = need_more_info</text>
    <text x="175" y="384" text-anchor="middle" font-size="11.5" fill="#9a3412">되묻기 반환</text>

    <!-- L -->
    <rect x="800" y="120" width="240" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="920" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">status = llm_error</text>

    <!-- E -->
    <rect x="800" y="450" width="240" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="920" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">status = invalid_input</text>
    <text x="920" y="494" text-anchor="middle" font-size="11" fill="#b91c1c">위반 필드 안내 · 세션에서 제거</text>

    <!-- X -->
    <rect x="800" y="645" width="240" height="60" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="920" y="681" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">status = endpoint_error</text>

    <!-- step badges -->
    <g font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="362" cy="150" r="12" fill="#1e293b"/><text x="362" y="154">1</text>
      <circle cx="362" cy="260" r="12" fill="#1e293b"/><text x="362" y="264">2</text>
      <circle cx="362" cy="370" r="12" fill="#1e293b"/><text x="362" y="374">3</text>
      <circle cx="362" cy="480" r="12" fill="#1e293b"/><text x="362" y="484">4</text>
      <circle cx="362" cy="580" r="12" fill="#1e293b"/><text x="362" y="584">5</text>
      <circle cx="362" cy="675" r="12" fill="#1e293b"/><text x="362" y="679">6</text>
      <circle cx="362" cy="770" r="12" fill="#1e293b"/><text x="362" y="774">7</text>
      <circle cx="362" cy="955" r="12" fill="#1e293b"/><text x="362" y="959">8</text>
    </g>

    <!-- legend -->
    <g transform="translate(40,1015)" font-size="11.5" fill="#475569">
      <line x1="0" y1="0" x2="34" y2="0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
      <text x="42" y="4">정상 흐름</text>
      <line x1="140" y1="0" x2="174" y2="0" stroke="#ef4444" stroke-width="1.8" marker-end="url(#ahr)"/>
      <text x="182" y="4">오류 종료</text>
      <line x1="280" y1="0" x2="314" y2="0" stroke="#f97316" stroke-width="1.8" marker-end="url(#aho)"/>
      <text x="322" y="4">정보 부족 → 되묻기</text>
      <line x1="470" y1="0" x2="504" y2="0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ahd)"/>
      <text x="512" y="4">사용자 재입력 루프 (멀티턴)</text>
    </g>
  </g>
</svg>
